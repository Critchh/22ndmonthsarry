<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Can't Wait To See Your Face</title>

    <link rel="stylesheet" href="Flames.css">
</head>
<body>

    <video class="bg-video" autoplay loop playsinline controls>
        <source src="videos/Dancing-in-the-flames.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <a href="javascript:history.back()" class="back-btn">← Back</a>

    <div class="polaroid">
        <img src="images/us1.jpg" alt="Us">

        <p>I can't wait to see your face.</p>
    </div>
<script>
    setTimeout(() => {
        document.querySelector(".polaroid").style.opacity = "0";
        document.querySelector(".polaroid").style.transition = "opacity 1s ease";
    }, 10000);
</script>
</body>
</html>
